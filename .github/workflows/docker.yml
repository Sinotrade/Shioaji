name: docker autobuild

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, for example v1.5.0'
        required: true
        default: 'v1.5.0'
      publish:
        description: 'Push Docker images'
        required: true
        default: 'false'
  push:
    tags:
      - '*'

jobs:
  tag_latest:
    name: Build Python image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image tags
        id: image
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid version: $VERSION" >&2; exit 1 ;;
          esac
          VERSION_NO_V="${VERSION#v}"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            PUSH=true
          else
            PUSH=false
          fi
          {
            echo "version=$VERSION"
            echo "version_no_v=$VERSION_NO_V"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI release
        run: |
          VERSION="${{ steps.image.outputs.version_no_v }}"
          # The tag reaches this repo before GitLab uploads the wheels, so wait
          # until pip can resolve the version instead of failing the build.
          for i in $(seq 1 60); do
            # Check the simple index pip actually resolves from, not just the JSON API.
            if curl -fsS "https://pypi.org/simple/shioaji/" | grep -q "shioaji-${VERSION}-"; then
              echo "shioaji ${VERSION} is on PyPI"; exit 0
            fi
            echo "waiting for shioaji ${VERSION} on PyPI (${i}/60)"; sleep 30
          done
          echo "shioaji ${VERSION} did not appear on PyPI within 30 minutes" >&2; exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.image.outputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: |
            sinotrade/shioaji:${{ steps.image.outputs.version }}
            sinotrade/shioaji:${{ steps.image.outputs.version_no_v }}
            sinotrade/shioaji:latest

  server:
    name: Build server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image tags
        id: image
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid version: $VERSION" >&2; exit 1 ;;
          esac
          VERSION_NO_V="${VERSION#v}"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            PUSH=true
          else
            PUSH=false
          fi
          {
            echo "version=$VERSION"
            echo "version_no_v=$VERSION_NO_V"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub release assets
        run: |
          VERSION="${{ steps.image.outputs.version }}"
          # The tag is pushed before GitLab creates the GitHub Release, so wait
          # until the Linux CLI tarballs the Dockerfile downloads exist.
          for i in $(seq 1 60); do
            ok=true
            for ARCH in x86_64 aarch64; do
              URL="https://github.com/sinotrade/shioaji/releases/download/${VERSION}/shioaji-${VERSION}-Linux-${ARCH}.tar.gz"
              curl -fsSLI -o /dev/null "$URL" || ok=false
            done
            if [ "$ok" = true ]; then echo "release assets for ${VERSION} are ready"; exit 0; fi
            echo "waiting for release assets of ${VERSION} (${i}/60)"; sleep 30
          done
          echo "release assets for ${VERSION} did not appear within 30 minutes" >&2; exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server
          push: ${{ steps.image.outputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: |
            sinotrade/shioaji-server:${{ steps.image.outputs.version }}
            sinotrade/shioaji-server:${{ steps.image.outputs.version_no_v }}
            sinotrade/shioaji-server:latest
